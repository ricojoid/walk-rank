services:
  # -----------------------------------------------------------
  # WalkRank Web Application
  # Connects directly to the PostgreSQL database on the VPS
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walkrank_app
    restart: always
    ports:
      - "${APP_PORT:-3005}:3000"
    environment:
      DATABASE_URL: "postgresql://admin:admin123@43.157.212.14:5432/walkrank?schema=public&sslmode=disable"
      POSTGRES_DEFAULT_DB: "POSTGRES_DB"
      WALKRANK_DB_NAME: "walkrank"
      JWT_SECRET: "walkrank_secure_jwt_secret_key_superadmin_and_users_2026"
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_APP_NAME: "WalkRank"
      PORT: 3000
      NODE_ENV: production
      SEED_DB: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
